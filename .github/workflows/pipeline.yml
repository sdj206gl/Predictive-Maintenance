
name: Predictive Maintenance MLOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: "3.11"
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  # =====================================
  # JOB 1: Code Quality & Testing
  # =====================================
  code-quality:
    name: Code Quality & Testing
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
        pip install -r predictive_maintenance_mlops/deployment/requirements.txt
    - name: Code Formatting with Black
      run: black predictive_maintenance_mlops/
      continue-on-error: true
    - name: Import Sorting with isort
      run: isort predictive_maintenance_mlops/
      continue-on-error: true
    - name: Lint with Flake8
      run: |
        flake8 predictive_maintenance_mlops/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 predictive_maintenance_mlops/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # =====================================
  # JOB 2: Data Pipeline
  # =====================================
  data-pipeline:
    name: Data Registration & Preparation
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn huggingface-hub
    - name: Create Data Directory
      run: mkdir -p predictive_maintenance_mlops/data
    - name: Data Registration
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: python predictive_maintenance_mlops/model_building/data_register.py
    - name: Data Preparation
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: python predictive_maintenance_mlops/model_building/prep.py
    - name: Upload Data Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: prepared-data
        path: |
          X_train.csv
          X_test.csv
          y_train.csv
          y_test.csv

  # =====================================
  # JOB 3: Model Training & Evaluation
  # =====================================
  model-training:
    name: Model Training & Hyperparameter Tuning
    runs-on: ubuntu-latest
    needs: data-pipeline
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install ML Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn xgboost mlflow huggingface-hub joblib
    - name: Download Data Artifacts
      uses: actions/download-artifact@v4
      with:
        name: prepared-data
    - name: Train Models
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        MLFLOW_TRACKING_URI: "file:./mlruns"
      run: python predictive_maintenance_mlops/model_building/model_training.py
    - name: Upload Model Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: trained-models
        path: |
          *.pkl
          model_comparison_results.csv
          mlruns/

  # =====================================
  # JOB 4: Model Validation
  # =====================================
  model-validation:
    name: Model Testing & Validation
    runs-on: ubuntu-latest
    needs: model-training
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install Dependencies
      run: pip install pandas numpy scikit-learn joblib
    - name: Download Model Artifacts
      uses: actions/download-artifact@v4
      with:
        name: trained-models
    - name: Download Data Artifacts
      uses: actions/download-artifact@v4
      with:
        name: prepared-data
    - name: Model Validation Tests
      run: |
        python -c "
        import joblib, pandas as pd, numpy as np
        from sklearn.metrics import accuracy_score
        model = joblib.load('best_model.pkl')
        X_test = pd.read_csv('X_test.csv')
        y_test = pd.read_csv('y_test.csv').squeeze()
        y_pred = model.predict(X_test)
        accuracy = accuracy_score(y_test, y_pred)
        print(f'Model Accuracy: {accuracy:.4f}')
        assert accuracy > 0.70, f'Accuracy {accuracy:.4f} below threshold 0.70'
        assert not np.isnan(y_pred).any(), 'NaN predictions detected'
        print('All validation tests passed!')
        "

  # =====================================
  # JOB 5: Deployment
  # =====================================
  deployment:
    name: Deploy to HuggingFace Spaces
    runs-on: ubuntu-latest
    needs: model-validation
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install Deployment Dependencies
      run: pip install huggingface-hub
    - name: Deploy to HuggingFace Spaces
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: python predictive_maintenance_mlops/deployment/deploy_to_hf_space.py
    - name: Deployment Success
      run: |
        echo "Deployment completed!"
        echo "App: https://huggingface.co/spaces/shashidj/Predictive-Maintenance"

  # =====================================
  # JOB 6: Performance Monitoring
  # =====================================
  monitoring:
    name: Performance Monitoring & Reporting
    runs-on: ubuntu-latest
    needs: deployment
    if: always()
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Download Training Report
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: trained-models
    - name: Generate Performance Report
      continue-on-error: true
      run: |
        python -c "
        import pandas as pd
        from datetime import datetime
        results = pd.read_csv('model_comparison_results.csv')
        best = results.iloc[0]
        report = f'# MLOps Performance Report\n\nDate: {datetime.now()}\n\nBest Model: {best[\"Model\"]}\nAccuracy: {best[\"Test_Accuracy\"]:.4f}\nF1: {best[\"Test_F1\"]:.4f}\n'
        with open('performance_report.md', 'w') as f:
            f.write(report)
        print('Report generated')
        "
    - name: Upload Performance Report
      uses: actions/upload-artifact@v4
      with:
        name: performance-report
        path: performance_report.md

  # =====================================
  # JOB 7: Auto-update Main Branch
  # =====================================
  auto-update:
    name: Auto-update Main Branch
    runs-on: ubuntu-latest
    needs: monitoring
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    - name: Configure Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
    - name: Download Performance Report
      uses: actions/download-artifact@v4
      with:
        name: performance-report
    - name: Commit Performance Report
      run: |
        mkdir -p reports
        mv performance_report.md reports/latest_performance_report.md
        if [[ -n $(git status --porcelain) ]]; then
          git add reports/latest_performance_report.md
          git commit -m "Auto-update: Performance report $(date +'%Y-%m-%d %H:%M:%S')"
          git push origin main
          echo "Performance report committed"
        else
          echo "No changes to commit"
        fi

  # =====================================
  # JOB 8: Cleanup
  # =====================================
  cleanup:
    name: Cleanup & Summary
    runs-on: ubuntu-latest
    needs: auto-update
    if: always()
    steps:
    - name: Pipeline Summary
      run: |
        echo "MLOps Pipeline Execution Complete"
        echo "   Code quality checks"
        echo "   Data processing"
        echo "   Model training"
        echo "   Model validation"
        echo "   Deployment"
        echo "   Performance monitoring"
        echo "   Repository updates"
        echo "Predictive Maintenance MLOps pipeline successfully executed!"
